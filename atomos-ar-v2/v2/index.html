<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Átomo en realidad aumentada</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#05070d;color:#eef0f6;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column}
h1{margin:0;padding:14px 16px 4px;font-size:22px}
p{margin:0;padding:0 16px 8px;color:#97a0b5;font-size:13px}
model-viewer{flex:1;width:100%;--poster-color:transparent}
button{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#59a6ff;color:#04101f;border:0;border-radius:999px;padding:14px 26px;font-size:16px;font-weight:600}
</style></head><body>
<h1 id="t">Cargando…</h1><p>Rojo s · amarillo p · verde d · morado f · puntos azules = electrones · núcleo: protones rojos y neutrones celestes</p>
<model-viewer id="mv" camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" shadow-intensity="0" exposure="1.4" alt="Átomo">
<button slot="ar-button">Ver en realidad aumentada</button>
</model-viewer>
<script>
const NOMBRES="H Hidrógeno|He Helio|Li Litio|Be Berilio|B Boro|C Carbono|N Nitrógeno|O Oxígeno|F Flúor|Ne Neón|Na Sodio|Mg Magnesio|Al Aluminio|Si Silicio|P Fósforo|S Azufre|Cl Cloro|Ar Argón|K Potasio|Ca Calcio|Sc Escandio|Ti Titanio|V Vanadio|Cr Cromo|Mn Manganeso|Fe Hierro|Co Cobalto|Ni Níquel|Cu Cobre|Zn Zinc|Ga Galio|Ge Germanio|As Arsénico|Se Selenio|Br Bromo|Kr Kriptón|Rb Rubidio|Sr Estroncio|Y Itrio|Zr Circonio|Nb Niobio|Mo Molibdeno|Tc Tecnecio|Ru Rutenio|Rh Rodio|Pd Paladio|Ag Plata|Cd Cadmio|In Indio|Sn Estaño|Sb Antimonio|Te Telurio|I Yodo|Xe Xenón|Cs Cesio|Ba Bario|La Lantano|Ce Cerio|Pr Praseodimio|Nd Neodimio|Pm Prometio|Sm Samario|Eu Europio|Gd Gadolinio|Tb Terbio|Dy Disprosio|Ho Holmio|Er Erbio|Tm Tulio|Yb Iterbio|Lu Lutecio|Hf Hafnio|Ta Tántalo|W Wolframio|Re Renio|Os Osmio|Ir Iridio|Pt Platino|Au Oro|Hg Mercurio|Tl Talio|Pb Plomo|Bi Bismuto|Po Polonio|At Astato|Rn Radón|Fr Francio|Ra Radio|Ac Actinio|Th Torio|Pa Protactinio|U Uranio|Np Neptunio|Pu Plutonio|Am Americio|Cm Curio|Bk Berkelio|Cf Californio|Es Einstenio|Fm Fermio|Md Mendelevio|No Nobelio|Lr Lawrencio|Rf Rutherfordio|Db Dubnio|Sg Seaborgio|Bh Bohrio|Hs Hasio|Mt Meitnerio|Ds Darmstatio|Rg Roentgenio|Cn Copernicio|Nh Nihonio|Fl Flerovio|Mc Moscovio|Lv Livermorio|Ts Teneso|Og Oganesón".split("|");
const q=new URLSearchParams(location.search).get("e")||location.hash.slice(1)||"1";
let Z=/^\d+$/.test(q)?+q:NOMBRES.findIndex(n=>n.split(" ")[0].toLowerCase()==q.toLowerCase())+1;
if(!(Z>=1&&Z<=118))Z=1;
const mv=document.getElementById("mv");
mv.src="glb/"+Z+".glb";mv.setAttribute("ios-src","usdz/"+Z+".usdz");
const [s,n]=NOMBRES[Z-1].split(" ");
document.getElementById("t").textContent=Z+" · "+s+" · "+n;document.title=n+" · átomo AR";
</script></body></html>
